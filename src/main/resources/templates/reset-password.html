<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h4 class="text-success text-center mb-3">Tạo Mật Khẩu Mới</h4>
                    <p class="text-muted text-center small">Xác thực thành công! Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <form action="/reset-password" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu mới</label>
                            <input type="password" name="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nhập lại mật khẩu mới</label>
                            <input type="password" name="confirmPassword" class="form-control" placeholder="Xác nhận mật khẩu mới" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 mb-3 fw-bold">Cập Nhật Mật Khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
