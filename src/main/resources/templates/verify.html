<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4 text-center">
                    <h4 class="text-primary mb-3">Xác thực Email</h4>
                    <p class="text-muted">Chúng tôi đã gửi mã OTP gồm 6 chữ số đến email: <br> <strong th:text="${email}"></strong></p>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <form action="/verify" method="POST">
                        <input type="hidden" name="email" th:value="${email}">
                        <div class="mb-4">
                            <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold" placeholder="Nhập 6 số OTP" required maxlength="6">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Xác Nhận</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
