<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h4 class="text-primary text-center mb-3">Nhập Mã Xác Thực</h4>
                    <p class="text-muted text-center small">Mã OTP đã được gửi đến email: <strong th:text="${email}"></strong></p>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <form action="/forgot-verify-otp" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã OTP (6 số)</label>
                            <input type="text" name="otp" class="form-control text-center fw-bold fs-4" placeholder="------" required maxlength="6">
                        </div>
                        <button type="submit" class="btn btn-warning text-white fw-bold w-100 mb-3">Xác Nhận OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
