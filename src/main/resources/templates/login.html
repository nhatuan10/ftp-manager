<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - FTP Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3 class="text-center text-primary mb-4">Quản Lý FTP</h3>
                        
                        <!-- Báo lỗi nếu đăng nhập sai -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tài khoản <span class="text-danger">*</span></label>
                                <input type="text" name="username" class="form-control" required placeholder="Nhập username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div>
                                    <input type="checkbox" name="remember" id="rem"> <label for="rem">Ghi nhớ</label>
                                </div>
                                <a href="/forgot-password" class="text-decoration-none small">Quên mật khẩu?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Đăng Nhập</button>
                            <div class="text-center small">
                                Chưa có tài khoản? <a href="/register" class="fw-bold text-decoration-none">Đăng ký ngay</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HỘP THOẠI MODAL POP-UP BẬT LÊN KHI TÀI KHOẢN CHƯA KÍCH HOẠT -->
    <div class="modal fade" id="activationModal" tabindex="-1" aria-hidden="true" th:if="${showActivationModal}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-danger fw-bold">⚠️ Tài Khoản Chưa Kích Hoạt</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted">Tài khoản của bạn chưa được xác thực email. Vui lòng bấm vào nút bên dưới để hệ thống gửi lại mã OTP kích hoạt.</p>
                    
                    <!-- Form ngầm gửi yêu cầu cấp mã OTP mới -->
                    <form action="/resend-otp" method="POST">
                        <input type="hidden" name="email" th:value="${unverifiedEmail}">
                        <button type="submit" class="btn btn-warning text-white fw-bold w-100 py-2 shadow-sm">
                            📩 Nhận Mã Kích Hoạt Ngay
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT TỰ ĐỘNG HIỆN POP-UP KHI CÓ CỜ HIỆU -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:if="${showActivationModal}">
        var myModal = new bootstrap.Modal(document.getElementById('activationModal'));
        myModal.show();
    </script>
</body>
</html>
